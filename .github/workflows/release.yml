name: Release

# 两种触发方式：
#   1. 手动：Actions → Release → Run workflow（无需 tag，产物走 Artifacts 下载）
#   2. 打 tag：git tag v0.1.0 && git push origin v0.1.0（自动建 Release 并挂上安装包）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install frontend deps
        run: npm install

      # beforeBuildCommand（npm run build）会自动先构建前端
      - name: Build (NSIS + MSI)
        run: npm run tauri build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-win
          cp src-tauri/target/release/bundle/nsis/*.exe dist-win/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi dist-win/ 2>/dev/null || true
          ls -lh dist-win/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist-win/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-win/*
          fail_on_unmatched_files: true

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479098"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479098" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479098" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Install frontend deps
        run: npm install

      # --ci 必须加：android init 默认是交互式的，不传会在 CI 里卡住
      # --skip-targets-install：rustup 目标上一步已装，避免重复
      - name: Generate Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Build APK (release)
        run: npx tauri android build --ci --apk

      - name: Sign APK
        run: |
          set -e
          UNSIGNED=$(find src-tauri/gen/android -name "*universal*release-unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          fi
          if [ -z "$UNSIGNED" ]; then
            echo "::error::未找到 release-unsigned APK"
            exit 1
          fi
          echo "unsigned apk: $UNSIGNED"
          mkdir -p dist-apk
          # 生成一次性签名密钥（仅用于本流水线签名，可自行替换为自己的 keystore）
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/libretv.jks" \
            -alias libretv -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass libretv123 -keypass libretv123 \
            -dname "CN=LibreTV, OU=App, O=LibreTV, L=NA, S=NA, C=CN" \
            -noprompt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/libretv.jks" --ks-key-alias libretv \
            --ks-pass pass:libretv123 --key-pass pass:libretv123 \
            --out dist-apk/LibreTV-android.apk "$UNSIGNED"
          ls -lh dist-apk/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          fail_on_unmatched_files: true
