name: Release

# 两种触发方式：
#   1. 手动：Actions → Release → Run workflow（无需 tag，产物走 Artifacts 下载）
#   2. 打 tag：git tag v0.1.0 && git push origin v0.1.0（自动建 Release 并挂上安装包）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install frontend deps
        run: npm install

      # beforeBuildCommand（npm run build）会自动先构建前端
      - name: Build (NSIS + MSI)
        run: npm run tauri build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-win
          cp src-tauri/target/release/bundle/nsis/*.exe dist-win/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi dist-win/ 2>/dev/null || true
          ls -lh dist-win/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist-win/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-win/*
          fail_on_unmatched_files: true

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意：不要用 android-actions/setup-android@v3 —— 它会执行 sdkmanager "tools"，
      # 而新版 cmdline-tools（16.x）已移除该包，会直接 exit 1。
      # ubuntu-latest 镜像已预装 Android SDK，直接接管环境变量即可。
      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_BIN=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$CMDLINE_BIN" ]; then
            echo "::error::未找到 cmdline-tools"
            exit 1
          fi
          echo "cmdline-tools: $CMDLINE_BIN"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          yes 2>/dev/null | "$CMDLINE_BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE_BIN/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME"

      # NDK 具体版本号会随 Google 仓库下架而变化，这里不写死：
      # 优先复用镜像预装的 NDK，否则从可用列表里选（Tauri 2 推荐 26.x）。
      - name: Install NDK
        run: |
          set -e
          NDK_DIR=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$NDK_DIR" ]; then
            PKG=$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;26\.[0-9.]+' | sort -V | tail -1 || true)
            if [ -z "$PKG" ]; then
              PKG=$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;[0-9]+\.[0-9.]+' | sort -V | tail -1 || true)
            fi
            if [ -z "$PKG" ]; then
              echo "::error::SDK 仓库中没有可用的 NDK 包"
              exit 1
            fi
            echo "install NDK package: $PKG"
            yes 2>/dev/null | sdkmanager --sdk_root="$ANDROID_HOME" "$PKG"
            NDK_DIR="$ANDROID_HOME/ndk/${PKG#ndk\;}"
          fi
          NDK_DIR="${NDK_DIR%/}"
          echo "NDK: $NDK_DIR"
          test -d "$NDK_DIR"
          {
            echo "ANDROID_NDK_ROOT=$NDK_DIR"
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "ANDROID_NDK_PATH=$NDK_DIR"
            echo "NDK_HOME=$NDK_DIR"
          } >> "$GITHUB_ENV"
          ls "$NDK_DIR"

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Install frontend deps
        run: npm install

      # --ci 必须加：android init 默认是交互式的，不传会在 CI 里卡住
      # --skip-targets-install：rustup 目标上一步已装，避免重复
      - name: Generate Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Build APK (release)
        run: npx tauri android build --ci --apk

      - name: Sign APK
        run: |
          set -e
          UNSIGNED=$(find src-tauri/gen/android -name "*universal*release-unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          fi
          if [ -z "$UNSIGNED" ]; then
            echo "::error::未找到 release-unsigned APK"
            exit 1
          fi
          echo "unsigned apk: $UNSIGNED"
          mkdir -p dist-apk
          # 生成一次性签名密钥（仅用于本流水线签名，可自行替换为自己的 keystore）
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/libretv.jks" \
            -alias libretv -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass libretv123 -keypass libretv123 \
            -dname "CN=LibreTV, OU=App, O=LibreTV, L=NA, S=NA, C=CN" \
            -noprompt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/libretv.jks" --ks-key-alias libretv \
            --ks-pass pass:libretv123 --key-pass pass:libretv123 \
            --out dist-apk/LibreTV-android.apk "$UNSIGNED"
          ls -lh dist-apk/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          fail_on_unmatched_files: true
