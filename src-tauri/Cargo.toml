[package]
name = "app"
version = "0.1.0"
description = "LibreTV Native — 免部署直装的跨平台影视聚合客户端"
authors = ["LibreTV"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
url = "2"
urlencoding = "2"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
